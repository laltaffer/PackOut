<script>
// Brand boot (spec: DESIGN.md) — ?brand= wins and persists, else stored, else flag.
(() => {
  const q = new URLSearchParams(location.search).get('brand')
  const valid = v => v === 'flag' || v === 'command'
  let b = valid(q) ? q : null
  try {
    if (b) localStorage.setItem('packout/brand', b)
    else { const s = localStorage.getItem('packout/brand'); if (valid(s)) b = s }
  } catch { /* storage blocked: default stands */ }
  document.documentElement.dataset.brand = b || 'flag'
})()
</script>
